server.port=8080

spring.application.name=dinnerCreator
spring.main.banner-mode=OFF

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# для уже существующей БД без пересоздания тома: добавит password_hash / role
spring.jpa.hibernate.ddl-auto=update
# чтобы правки index.html сразу попадали в браузер при разработке
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.period=0

spring.datasource.username=dbuser
spring.datasource.password=12345
spring.datasource.url=jdbc:postgresql://localhost:5433/productmanager
spring.datasource.driver-class-name=org.postgresql.Driver

# учётка администратора (создаётся при старте, если ещё нет)
app.admin.email=${ADMIN_EMAIL:admin@local}
app.admin.password=${ADMIN_PASSWORD:admin123}
